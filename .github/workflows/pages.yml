name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar MediaPipe e modelos locais
        run: node tools/vendor-mediapipe.mjs
      - name: Conferir existência dos sete arquivos de IA antes do deploy
        run: node tools/check-photo-deployment.mjs --local
      - name: Validar dados e estrutura
        run: |
          python3 tools/extract-avatar-components.py --check
          node tools/build-avatar-presets.mjs --check
          node tools/build-pet-parts.mjs --check
          node tools/build-new-books.mjs --check
          node tools/build-escovacao-rapunzel.mjs --check
          node tools/build-classicos-publicos.mjs --check
          node tools/illustrate-books.mjs --check
          node tests/verify.mjs
          node tests/new-books.test.mjs
          node tests/preferences.test.mjs
          node tests/family-parental.test.mjs
          node tests/colors.test.mjs
          node tests/avatar.test.mjs
          node tests/pix-landing.test.mjs
          node tests/avatar-photo.test.mjs
          node tests/avatar-photo-enhancements.test.mjs
          node tests/avatar-photo-picker.test.mjs
          node tests/avatar-photo-availability.test.mjs
          node tests/progression.test.mjs
          node tests/book-rewards.test.mjs
          node tests/page-turn.test.mjs
          node tests/page-turn-adaptive.test.mjs
          node tests/speech.test.mjs
          node tests/offline.test.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Separar arquivos públicos
        run: |
          mkdir -p _site/assets
          cp index.html livro.html personagem.html perfil.html prateleira.html manifest.webmanifest sw.js .nojekyll _site/
          cp -R books _site/books
          cp -R assets/css assets/js assets/data assets/icons assets/images assets/illustrations _site/assets/
          cp -R assets/pets _site/assets/
          cp -R assets/vendor _site/assets/
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar IA no endereço público (não aceitar 404 após publicação)
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/check-photo-deployment.mjs --public
