<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3e8">
  <meta name="description" content="Leia uma história ilustrada e pratique sons e palavras em um livrinho interativo.">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/css/app.css">
  <script src="./assets/js/reader.js" defer></script>
  <script src="./assets/js/pwa.js" defer></script>
  <title>Lendo um livrinho · Prateleira de Livrinhos</title>
</head>
<body>
  <main class="shell">
    <header class="topbar reader-topbar">
      <a class="back-to-shelf" href="./index.html" aria-label="Voltar para a prateleira">← <span>Prateleira</span></a>
      <img class="reader-logo" src="./assets/icons/icon.svg" alt="" width="45" height="45">
      <div class="brand-copy"><strong id="bookBrand">Meu livrinho</strong><span>Uma aventura de leitura e descobertas</span></div>
      <div class="top-pill">✦ Feito para ler com carinho</div>
    </header>
    <div id="readerError" class="reader-error" hidden role="alert"></div>
    <section id="readerApp" hidden aria-label="Leitor de livros">
      <div class="progress" aria-label="Progresso da leitura"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><span class="progress-label" id="progressLabel"></span></div>
      <article class="book" id="book" aria-live="polite">
        <section class="art-panel" aria-label="Ilustração da página"><img id="scene" alt=""><div class="art-sticker" id="artSticker"></div></section>
        <section class="read-panel" id="readPanel"></section>
      </article>
      <nav class="controls" aria-label="Navegação das páginas">
        <button class="nav-button prev" id="prev" type="button" aria-label="Página anterior" aria-keyshortcuts="ArrowLeft">← Voltar</button>
        <button class="nav-button listen" id="listen" type="button" title="Ouvir a página (barra de espaço)" aria-keyshortcuts="Space">🔊 Ouvir</button>
        <button class="nav-button next" id="next" type="button" aria-keyshortcuts="ArrowRight">Começar →</button>
      </nav>
      <div class="dots" id="dots" aria-label="Escolher página"></div>
      <p class="bottom-note">Toque nas palavras coloridas para ouvi-las. Teclado: ← anterior · → próxima · Espaço ouvir. Também é possível deslizar para os lados.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
