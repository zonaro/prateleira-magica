<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3e8">
  <meta name="description" content="Leia uma história ilustrada e pratique sons e palavras em um livrinho interativo.">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/css/app.css">
  <script src="./assets/js/avatar-parts.js" defer></script>
  <script src="./assets/js/avatar-presets.js" defer></script>
  <script src="./assets/js/pet-parts.js" defer></script>
  <script src="./assets/js/avatar.js" defer></script>
  <script src="./assets/js/preferences.js" defer></script>
  <script src="./assets/vendor/NameToColor.js" defer></script>
  <script src="./assets/vendor/NameToColor.ptBR.js" defer></script>
  <script src="./assets/js/colors.js" defer></script>
  <script src="./assets/js/color-explorer.js" defer></script>
  <script src="./assets/js/speech.js" defer></script>
  <script src="./assets/vendor/page-flip.browser.js" defer></script>
  <script src="./assets/js/page-turn.js" defer></script>
  <script src="./assets/js/reader.js" defer></script>
  <script src="./assets/js/pwa.js" defer></script>
  <title>Lendo um livrinho · Prateleira Mágica</title>
</head>
<body class="reader-screen">
  <main class="shell reader-shell">
    <div id="readerError" class="reader-error" hidden role="alert"></div>
    <section id="readerApp" hidden aria-label="Leitor de livros">
      <div class="progress" aria-label="Progresso da leitura"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><span class="progress-label" id="progressLabel"></span></div>
      <div class="book" id="book" aria-label="Páginas do livrinho. Arraste um canto para virar a página."></div>
      <div class="dots" id="dots" aria-label="Escolher página"></div>
      <p class="bottom-note">Toque nas palavras coloridas para ouvi-las. Arraste os cantos das páginas para virá-las. Teclado: ← anterior · → próxima · Espaço para ouvir ou pausar.</p>
      <nav class="controls" aria-label="Navegação e leitura">
        <a class="nav-button shelf-nav" href="./prateleira.html" aria-label="Voltar à prateleira"><span aria-hidden="true">📚</span><span>Prateleira</span></a>
        <button class="nav-button listen" id="listen" type="button" title="Ouvir ou pausar a página (barra de espaço)" aria-label="Ouvir a página" aria-pressed="false" aria-keyshortcuts="Space"><span class="listen-icon" aria-hidden="true">▶</span><span class="listen-text">Ouvir</span></button>
        <button class="nav-button prev" id="prev" type="button" aria-label="Página anterior" aria-keyshortcuts="ArrowLeft"><span aria-hidden="true">←</span><span>Voltar</span></button>
        <button class="nav-button next" id="next" type="button" aria-keyshortcuts="ArrowRight"><span class="next-text">Começar</span><span aria-hidden="true">→</span></button>
      </nav>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
